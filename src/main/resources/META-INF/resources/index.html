<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyLake — Delta Lake Browser</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --sidebar-w: 280px; }
    body { background: #f4f6f9; font-size: 0.9rem; transition: background .2s, color .2s; }

    /* Dark mode */
    body.dark-mode { background: #1a1c27; color: #d0d5e8; }
    body.dark-mode .navbar { background: #10121e !important; }
    body.dark-mode #path-bar { background: #22243a; border-color: #333655; }
    body.dark-mode #path-bar .input-group-text { background: #22243a !important; color: #9aa5b4; border-color: #333655; }
    body.dark-mode #path-bar .form-control { background: #22243a; color: #d0d5e8; border-color: #333655; }
    body.dark-mode #path-bar .form-control::placeholder { color: #6c7a9a; }
    body.dark-mode #path-bar .btn-outline-secondary { color: #9aa5b4; border-color: #333655; }
    body.dark-mode #path-bar .btn-outline-secondary:hover { background: #2e3050; }
    body.dark-mode #sidebar { background: #1e2035; border-color: #333655; }
    body.dark-mode .sidebar-header { background: #171929; border-color: #333655; color: #8b9ec7; }
    body.dark-mode .tbl-item { border-color: #2a2d4a; }
    body.dark-mode .tbl-item:hover { background: #252845; }
    body.dark-mode .tbl-item.active { background: #1e2d5e; border-color: #4285f4; }
    body.dark-mode .tbl-name { color: #d0d5e8; }
    body.dark-mode #content { background: #1e2035; }
    body.dark-mode #content-header { background: #171929; border-color: #333655; }
    body.dark-mode #pager { background: #171929; border-color: #333655; }
    body.dark-mode .data-tbl tbody td { border-color: #2a2d4a; }
    body.dark-mode .data-tbl tbody tr:hover td { background: #252845; }
    body.dark-mode #filter-bar { background: #1e2035; border-color: #333655; }
    body.dark-mode #filter-bar .form-control { background: #22243a; color: #d0d5e8; border-color: #333655; }
    body.dark-mode .state-box { color: #6c7a9a; }
    body.dark-mode .toast-container .toast { background: #2a0a0a; }
    body.dark-mode .modal-content { background: #1e2035; color: #d0d5e8; }
    body.dark-mode .modal-header { border-color: #333655; }
    body.dark-mode .modal-footer { border-color: #333655; background: #171929; }
    body.dark-mode #browse-current-path { background: #171929; border-color: #333655; color: #8b9ec7; }
    body.dark-mode .browse-item:hover { background: #252845; }
    body.dark-mode .browse-up { background: #1a1c2f; }
    body.dark-mode .browse-up:hover { background: #252845; }
    body.dark-mode .dropdown-menu { background: #22243a; border-color: #333655; }
    body.dark-mode .dropdown-item { color: #d0d5e8; }
    body.dark-mode .dropdown-item:hover { background: #2e3050; }
    body.dark-mode .dropdown-item.disabled { color: #6c7a9a; }
    body.dark-mode .btn-outline-secondary { color: #9aa5b4; border-color: #555e7a; }
    body.dark-mode #sql-editor-panel { background: #1e2035; border-color: #333655; }
    body.dark-mode #sql-editor-panel textarea { background: #22243a; color: #d0d5e8; border-color: #333655; }
    body.dark-mode #sql-results-container { background: #1e2035; }
    body.dark-mode .sql-result-tbl thead th { background: #171929; color: #8b9ec7; border-color: #333655; }
    body.dark-mode .sql-result-tbl tbody td { border-color: #2a2d4a; }
    body.dark-mode .btn-outline-secondary:hover { background: #2e3050; color: #d0d5e8; }
    body.dark-mode .text-muted { color: #8b9ec7 !important; }
    body.dark-mode #sidebar-search { background: #22243a; color: #d0d5e8; border-color: #333655; }
    body.dark-mode #sidebar-search::placeholder { color: #6c7a9a; }
    body.dark-mode #sidebar-search-wrap { background: #1e2035; border-color: #333655; }

    /* Dark mode toggle button */
    #dark-toggle { font-size: .82rem; padding: .2rem .5rem; border-radius: 4px;
                   cursor: pointer; border: 1px solid #8b9ec7; color: #8b9ec7;
                   background: transparent; transition: all .15s; line-height: 1.4; }
    #dark-toggle:hover { border-color: #fff; color: #fff; }

    /* Layout */
    #app-layout { display: flex; height: calc(100vh - 110px); overflow: hidden; }
    #sidebar    { width: var(--sidebar-w); min-width: var(--sidebar-w); background: #fff;
                  border-right: 1px solid #dee2e6; display: flex; flex-direction: column; overflow: hidden; }
    #content    { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; }

    /* Navbar */
    .navbar { background: #1a1f36 !important; }
    .navbar-brand { font-weight: 700; letter-spacing: .03em; color: #fff !important; }
    .navbar-brand small { color: #8b9ec7; font-size: .75rem; }

    /* Language switcher */
    .lang-btn { font-size: .78rem; padding: .2rem .55rem; border-radius: 4px;
                cursor: pointer; border: 1px solid #8b9ec7; color: #8b9ec7;
                background: transparent; transition: all .15s; line-height: 1.4; }
    .lang-btn:hover { border-color: #fff; color: #fff; }
    .lang-btn.active { border-color: #fff; color: #1a1f36; background: #fff; font-weight: 600; }

    /* Path bar */
    #path-bar { background: #fff; border-bottom: 1px solid #dee2e6; padding: .6rem 1rem; }
    #path-bar .input-group { max-width: 720px; }

    /* Sidebar */
    .sidebar-header { padding: .55rem .75rem; font-size: .72rem; font-weight: 600;
                      color: #6c757d; text-transform: uppercase; letter-spacing: .06em;
                      background: #f8f9fa; border-bottom: 1px solid #eee; }
    #sidebar-search-wrap { padding: .4rem .6rem; border-bottom: 1px solid #eee;
                           background: #fff; flex-shrink: 0; }
    #sidebar-search { width: 100%; font-size: .8rem; padding: .25rem .5rem;
                      border: 1px solid #dee2e6; border-radius: 4px; outline: none; }
    #sidebar-search:focus { border-color: #4285f4; }
    #table-list     { overflow-y: auto; flex: 1; }
    .tbl-item       { padding: .5rem .75rem; cursor: pointer; border-bottom: 1px solid #f2f2f2;
                      transition: background .1s; }
    .tbl-item:hover { background: #f0f5ff; }
    .tbl-item.active { background: #e8f0fe; border-left: 3px solid #4285f4; }
    .tbl-name       { font-weight: 600; color: #212529; font-size: .87rem; }
    .tbl-path       { font-size: .73rem; color: #9aa5b4; white-space: nowrap;
                      overflow: hidden; text-overflow: ellipsis; }

    /* Content header */
    #content-header { padding: .5rem .85rem; border-bottom: 1px solid #eee;
                      background: #fafbfc; display: flex; align-items: center; gap: .75rem;
                      flex-shrink: 0; }
    .tbl-title      { font-weight: 700; font-size: .95rem; }
    .meta-badge     { font-size: .72rem; color: #6c757d; white-space: nowrap; }

    /* Data table */
    #table-scroll   { overflow: auto; flex: 1; }
    .data-tbl       { font-size: .82rem; margin: 0; }
    .data-tbl thead th { position: sticky; top: 0; background: #1a1f36; color: #fff;
                         white-space: nowrap; border: none; padding: .45rem .6rem; }
    .data-tbl thead th.sortable { cursor: pointer; user-select: none; }
    .data-tbl thead th.sortable:hover { background: #252b45; }
    .data-tbl thead th .col-type { font-size: .68rem; font-weight: 400; color: #8b9ec7;
                                    display: block; margin-top: 1px; }
    .data-tbl thead th .sort-icon { font-size: .7rem; margin-left: .3rem; opacity: .5; }
    .data-tbl thead th.sort-asc  .sort-icon,
    .data-tbl thead th.sort-desc .sort-icon { opacity: 1; color: #a8d8ff; }
    .data-tbl tbody td { white-space: nowrap; max-width: 280px; overflow: hidden;
                         text-overflow: ellipsis; padding: .32rem .6rem;
                         border-color: #f0f0f0; vertical-align: middle; }
    .data-tbl .row-num { color: #bbb; user-select: none; width: 46px; text-align: right; }
    .null-val         { color: #bbb; font-style: italic; font-size: .8rem; }

    /* Footer / pagination */
    #pager  { padding: .45rem .85rem; background: #fafbfc; border-top: 1px solid #eee;
              flex-shrink: 0; }
    .page-link { font-size: .82rem; padding: .22rem .55rem; }

    /* Empty / loading states */
    .state-box { display: flex; flex-direction: column; align-items: center; justify-content: center;
                 height: 100%; color: #9aa5b4; gap: .5rem; }
    .state-box .icon { font-size: 2.5rem; }

    /* Toast */
    .toast-container { z-index: 9999; }


    /* Inline SQL editor */
    #sql-editor-panel { background: #fff; border-top: 1px solid #dee2e6; flex-shrink: 0; }
    #sql-editor-header { padding: .35rem .85rem; background: #fafbfc; border-bottom: 1px solid #eee;
                         display: flex; align-items: center; gap: .5rem; user-select: none; }
    #sql-editor-body { padding: .5rem .85rem; }
    #sql-editor-body textarea { font-family: monospace; font-size: .82rem; resize: vertical; }
    #sql-results-container { overflow-x: auto; max-height: 220px; overflow-y: auto; }
    .sql-result-tbl { font-size: .78rem; margin: 0; width: 100%; }
    .sql-result-tbl thead th { position: sticky; top: 0; background: #f1f3f6; color: #495057;
                                white-space: nowrap; padding: .3rem .6rem; border-bottom: 1px solid #dee2e6; }
    .sql-result-tbl tbody td { white-space: nowrap; padding: .25rem .6rem; border-color: #f0f0f0;
                                max-width: 220px; overflow: hidden; text-overflow: ellipsis; }

    /* Directory browser modal */
    #browse-current-path { font-family: monospace; font-size: .82rem; padding: .5rem .75rem;
                           background: #f8f9fa; border-bottom: 1px solid #dee2e6;
                           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .browse-item  { display: flex; align-items: center; gap: .5rem; padding: .42rem .75rem;
                    cursor: pointer; border-bottom: 1px solid #f5f5f5; transition: background .1s; }
    .browse-item:hover  { background: #f0f5ff; }
    .browse-item:last-child { border-bottom: none; }
    .browse-up    { background: #fafafa; }
    .browse-up:hover { background: #eef3ff; }
    .browse-icon  { font-size: 1rem; flex-shrink: 0; }
    .browse-name  { font-size: .87rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Schema inspector panel */
    #schema-panel { position: absolute; top: 0; right: 0; bottom: 0; width: 260px;
                    background: #fff; border-left: 1px solid #dee2e6; display: flex;
                    flex-direction: column; z-index: 10; transform: translateX(100%);
                    transition: transform .2s ease; overflow: hidden; }
    #schema-panel.open { transform: translateX(0); }
    #content { position: relative; }  /* needed for schema panel absolute positioning */
    #schema-panel-header { padding: .55rem .75rem; font-size: .72rem; font-weight: 600;
                           color: #6c757d; text-transform: uppercase; letter-spacing: .06em;
                           background: #f8f9fa; border-bottom: 1px solid #eee;
                           display: flex; align-items: center; justify-content: space-between; }
    #schema-list { overflow-y: auto; flex: 1; font-size: .82rem; }
    .schema-row { padding: .38rem .75rem; border-bottom: 1px solid #f5f5f5; }
    .schema-row:last-child { border-bottom: none; }
    .schema-col-name { font-weight: 600; color: #212529; }
    .schema-col-type { font-size: .72rem; color: #6c757d; margin-top: 1px; }
    .schema-nullable { font-size: .65rem; color: #adb5bd; margin-left: .3rem; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark px-3 py-2">
  <span class="navbar-brand mb-0">
    MyLake <small>Delta Lake Browser</small>
  </span>
  <div class="d-flex align-items-center gap-2">
    <button id="dark-toggle" onclick="toggleDarkMode()" title="Toggle dark mode">🌙</button>
    <button class="lang-btn active" id="lang-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="lang-zh" onclick="setLang('zh')">中文</button>
    <span id="status-badge" class="badge bg-secondary px-2 py-1 ms-2">Checking…</span>
  </div>
</nav>

<!-- Path bar -->
<div id="path-bar">
  <div class="input-group">
    <span class="input-group-text bg-white">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="#6c757d" viewBox="0 0 16 16">
        <path d="M9.828 3h3.982a2 2 0 0 1 1.992 2.181l-.637 7A2 2 0 0 1 13.174 14H2.826a2 2 0 0 1-1.991-1.819l-.637-7a2 2 0 0 1 .342-1.31L.5 3a2 2 0 0 1 2-2h3.672a2 2 0 0 1 1.414.586l.828.828A2 2 0 0 0 9.828 3zm-8.322.12C1.72 3.042 1.95 3 2.19 3h5.396l-.707-.707A1 1 0 0 0 6.172 2H2.5a1 1 0 0 0-1 .981l.006.139z"/>
      </svg>
    </span>
    <input id="lake-path" type="text" class="form-control border-start-0"
           placeholder="Delta Lake root directory, e.g. /data/my_lake"
           autocomplete="off">
    <button class="btn btn-outline-secondary px-3" onclick="openBrowseModal()" title="Browse filesystem">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16">
        <path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h2.764c.958 0 1.76.56 2.311 1.184C7.985 3.648 8.48 4 9 4h4.5A1.5 1.5 0 0 1 15 5.5v.64c.57.265.94.876.856 1.546l-.64 5.124A2.5 2.5 0 0 1 12.733 15H3.266a2.5 2.5 0 0 1-2.481-2.19l-.64-5.124A1.5 1.5 0 0 1 1 6.14zm2 6a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5zm0-3a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5z"/>
      </svg>
    </button>
    <button id="recent-paths-toggle" type="button"
            class="btn btn-outline-secondary dropdown-toggle dropdown-toggle-split"
            data-bs-toggle="dropdown" aria-expanded="false"
            title="Recently used paths">
      <span class="visually-hidden">Recent paths</span>
    </button>
    <ul id="recent-paths-menu" class="dropdown-menu dropdown-menu-end"
        aria-labelledby="recent-paths-toggle">
      <li><span class="dropdown-item disabled">No recent paths</span></li>
    </ul>
    <button class="btn btn-primary px-3" onclick="loadTables()" data-i18n="loadTables">Load Tables</button>
  </div>
</div>

<!-- Main layout -->
<div id="app-layout">

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header" data-i18n="tables">Tables</div>
    <div id="sidebar-search-wrap">
      <input id="sidebar-search" type="search" placeholder="Filter tables…"
             oninput="filterTableList(this.value)"
             title="Filter tables (press / to focus)">
    </div>
    <div id="table-list">
      <div class="state-box">
        <div class="icon">🗂</div>
        <div data-i18n="enterPath">Enter a path and click "Load Tables"</div>
      </div>
    </div>
  </div>

  <!-- Content area -->
  <div id="content">
    <div id="content-inner" style="display:flex;flex-direction:column;height:100%">
      <div class="state-box">
        <div class="icon">📊</div>
        <div data-i18n="selectTable">Select a table from the list</div>
      </div>
    </div>
    <!-- Schema inspector panel -->
    <div id="schema-panel">
      <div id="schema-panel-header">
        <span>Schema</span>
        <button class="btn-close" style="font-size:.7rem" onclick="closeSchemaPanel()" aria-label="Close schema"></button>
      </div>
      <div id="schema-list"></div>
    </div>
  </div>

</div>

<!-- Directory browser modal -->
<div class="modal fade" id="browse-modal" tabindex="-1" aria-labelledby="browse-modal-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title" id="browse-modal-label">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" class="me-1" viewBox="0 0 16 16">
            <path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h2.764c.958 0 1.76.56 2.311 1.184C7.985 3.648 8.48 4 9 4h4.5A1.5 1.5 0 0 1 15 5.5v.64c.57.265.94.876.856 1.546l-.64 5.124A2.5 2.5 0 0 1 12.733 15H3.266a2.5 2.5 0 0 1-2.481-2.19l-.64-5.124A1.5 1.5 0 0 1 1 6.14zm2 6a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5zm0-3a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5z"/>
          </svg>
          <span data-i18n="selectDirectory">Select Directory</span>
        </h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div id="browse-current-path" class="text-muted">/</div>
      <div class="modal-body p-0">
        <div id="browse-list" style="min-height: 200px; max-height: 380px; overflow-y: auto;"></div>
      </div>
      <div class="modal-footer py-2">
        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
        <button type="button" class="btn btn-sm btn-primary" onclick="confirmBrowse()" data-i18n="selectThisDir">Select This Directory</button>
      </div>
    </div>
  </div>
</div>

<!-- Error toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="err-toast" class="toast align-items-center text-bg-danger border-0" role="alert" data-bs-autohide="true" data-bs-delay="4000">
    <div class="d-flex">
      <div class="toast-body" id="toast-msg"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ── i18n ───────────────────────────────────────────────────────────────────────
const TRANSLATIONS = {
  en: {
    loadTables:       'Load Tables',
    tables:           'Tables',
    enterPath:        'Enter a path and click "Load Tables"',
    selectTable:      'Select a table from the list',
    selectDirectory:  'Select Directory',
    cancel:           'Cancel',
    selectThisDir:    'Select This Directory',
    statusChecking:   'Checking…',
    statusReady:      'Delta Ready',
    statusNotReady:   'Delta Not Ready',
    statusOffline:    'Server Offline',
    loadingTables:    'Loading tables…',
    noTablesFound:    'No Delta tables found',
    loadingData:      'Loading data…',
    noData:           '(no data)',
    perPage:          'Per page',
    rowsPerPage:      'Rows per page',
    showing:          'Showing',
    of:               'of',
    rows:             'rows',
    columns:          'columns',
    exportCsv:        'Export CSV',
    parentDirectory:  'parent directory',
    noSubdirs:        'No subdirectories',
    errEnterPath:     'Please enter a directory path',
    errDeltaExt:      'Failed to load delta extension: ',
    errNothingExport: 'Nothing to export — load a table first.',
    noRecentPaths:    'No recent paths',
    pathPlaceholder:  'Delta Lake root directory, e.g. /data/my_lake',
  },
  zh: {
    loadTables:       '加载表',
    tables:           '数据表',
    enterPath:        '输入路径并点击“加载表”',
    selectTable:      '从列表中选择一张表',
    selectDirectory:  '选择目录',
    cancel:           '取消',
    selectThisDir:    '选择此目录',
    statusChecking:   '检查中…',
    statusReady:      'Delta 就绪',
    statusNotReady:   'Delta 未就绪',
    statusOffline:    '服务器离线',
    loadingTables:    '正在加载表…',
    noTablesFound:    '未找到 Delta 表',
    loadingData:      '正在加载数据…',
    noData:           '（无数据）',
    perPage:          '每页',
    rowsPerPage:      '每页行数',
    showing:          '显示',
    of:               '共',
    rows:             '行',
    columns:          '列',
    exportCsv:        '导出 CSV',
    parentDirectory:  '上级目录',
    noSubdirs:        '没有子目录',
    errEnterPath:     '请输入目录路径',
    errDeltaExt:      '加载 Delta 扩展失败：',
    errNothingExport: '无内容可导出——请先加载一张表。',
    noRecentPaths:    '暂无最近路径',
    pathPlaceholder:  'Delta Lake 根目录，例如 /data/my_lake',
  }
};

// Auto-detect from browser locale if no preference saved
const _savedLang = localStorage.getItem('mylake-lang');
const _browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
const _detectedLang = _browserLang.startsWith('zh') ? 'zh' : 'en';
let currentLang = _savedLang || _detectedLang;

function t(key) {
  return (TRANSLATIONS[currentLang] || TRANSLATIONS.en)[key] || key;
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('mylake-lang', lang);
  applyTranslations();
}

function applyTranslations() {
  // Update lang buttons
  document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');
  document.getElementById('lang-zh').classList.toggle('active', currentLang === 'zh');

  // Update html lang attribute
  document.documentElement.lang = currentLang === 'zh' ? 'zh-Hans' : 'en';

  // Update all elements with data-i18n attribute
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });

  // Update path placeholder
  document.getElementById('lake-path').placeholder = t('pathPlaceholder');
}

// ── Page-size preference (persisted) ──────────────────────────────────────────
const PAGE_SIZE_OPTIONS = [25, 50, 100, 250, 500];
const PAGE_SIZE_DEFAULT = 50;
const PAGE_SIZE_MAX     = 1000; // backend hard cap
const PAGE_SIZE_LS_KEY  = 'mylake.pageSize';

function loadPageSize() {
  try {
    const raw = localStorage.getItem(PAGE_SIZE_LS_KEY);
    const n = Number.parseInt(raw, 10);
    if (Number.isFinite(n) && n > 0) return Math.min(n, PAGE_SIZE_MAX);
  } catch { /* localStorage unavailable */ }
  return PAGE_SIZE_DEFAULT;
}

function savePageSize(n) {
  try { localStorage.setItem(PAGE_SIZE_LS_KEY, String(n)); }
  catch { /* localStorage unavailable */ }
}
}

// ── State ─────────────────────────────────────────────────────────────────────
let state = {
  lakePath: '',
  table: '',
  page: 0,
  pageSize: loadPageSize(),
  totalPages: 0,
  totalRows: 0,
  // Cached from the last /api/table/data response for client-side actions like CSV export.
  lastColumns: null,
  lastRows: null,
  // Client-side sort state: { colIdx: number, dir: 'asc'|'desc' } or null
  sortState: null,
};

// ── Boot ──────────────────────────────────────────────────────────────────────
document.getElementById('lake-path').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadTables();
});
// Repopulate the recent-paths menu just before it opens, so it always reflects
// the latest localStorage state (including changes from another tab).
document.getElementById('recent-paths-toggle')
  .addEventListener('show.bs.dropdown', renderRecentPathsMenu);
renderRecentPathsMenu();
initDarkMode();
applyTranslations();
checkStatus();

// ── Recent lake paths (persisted) ─────────────────────────────────────────────
const RECENT_PATHS_LS_KEY = 'mylake.recentPaths';
const RECENT_PATHS_MAX    = 5;

function loadRecentPaths() {
  try {
    const raw = localStorage.getItem(RECENT_PATHS_LS_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr.filter(p => typeof p === 'string') : [];
  } catch { return []; }
}

function saveRecentPaths(list) {
  try { localStorage.setItem(RECENT_PATHS_LS_KEY, JSON.stringify(list)); }
  catch { /* localStorage unavailable */ }
}

function pushRecentPath(path) {
  if (!path) return;
  const current = loadRecentPaths().filter(p => p !== path);
  current.unshift(path);
  saveRecentPaths(current.slice(0, RECENT_PATHS_MAX));
}

function renderRecentPathsMenu() {
  const menu = document.getElementById('recent-paths-menu');
  const paths = loadRecentPaths();
  if (paths.length === 0) {
    menu.innerHTML = `<li><span class="dropdown-item disabled">${t('noRecentPaths')}</span></li>`;
    return;
  }
  menu.innerHTML = paths.map(p => `
    <li><a class="dropdown-item" href="#" title="${attr(p)}"
           onclick="useRecentPath('${attr(p)}');return false">${esc(p)}</a></li>`
  ).join('');
}

function useRecentPath(path) {
  document.getElementById('lake-path').value = path;
  loadTables();
}

// ── API helpers ───────────────────────────────────────────────────────────────
async function apiFetch(url) {
  const resp = await fetch(url);
  const json = await resp.json();
  if (!resp.ok) throw new Error(json.error || 'HTTP ' + resp.status);
  return json;
}

// ── Dark mode ─────────────────────────────────────────────────────────────────
const DARK_MODE_LS_KEY = 'mylake.darkMode';

function initDarkMode() {
  // Respect saved preference, fall back to system preference
  const saved = localStorage.getItem(DARK_MODE_LS_KEY);
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const dark = saved !== null ? saved === 'true' : prefersDark;
  setDarkMode(dark, false);  // false = don't save on initial load
}

function setDarkMode(on, save = true) {
  document.body.classList.toggle('dark-mode', on);
  document.getElementById('dark-toggle').textContent = on ? '☀️' : '🌙';
  if (save) {
    try { localStorage.setItem(DARK_MODE_LS_KEY, String(on)); }
    catch { /* localStorage unavailable */ }
  }
}

function toggleDarkMode() {
  setDarkMode(!document.body.classList.contains('dark-mode'));
}

// ── Status ────────────────────────────────────────────────────────────────────
async function checkStatus() {
  const badge = document.getElementById('status-badge');
  badge.textContent = t('statusChecking');
  try {
    const d = await apiFetch('/api/status');
    if (d.ready) {
      badge.textContent = t('statusReady');
      badge.className = 'badge bg-success px-2 py-1 ms-2';
    } else {
      badge.textContent = t('statusNotReady');
      badge.className = 'badge bg-danger px-2 py-1 ms-2';
      if (d.error) showErr(t('errDeltaExt') + d.error);
    }
  } catch {
    badge.textContent = t('statusOffline');
    badge.className = 'badge bg-danger px-2 py-1 ms-2';
  }
}

// ── Sidebar table search ───────────────────────────────────────────────────────
function filterTableList(query) {
  const q = (query || '').toLowerCase().trim();
  const items = document.querySelectorAll('#table-list .tbl-item');
  let visibleCount = 0;
  items.forEach(el => {
    const name = (el.dataset.name || '').toLowerCase();
    const visible = !q || name.includes(q);
    el.style.display = visible ? '' : 'none';
    if (visible) visibleCount++;
  });
  // Show "no match" state if no items visible
  const noMatch = document.getElementById('sidebar-no-match');
  if (noMatch) noMatch.style.display = (q && visibleCount === 0 && items.length > 0) ? '' : 'none';
}

function clearSidebarSearch() {
  const input = document.getElementById('sidebar-search');
  if (input) { input.value = ''; filterTableList(''); }
}

// ── Load table list ───────────────────────────────────────────────────────────
async function loadTables() {
  const path = document.getElementById('lake-path').value.trim();
  if (!path) { showErr(t('errEnterPath')); return; }
  state.lakePath = path;
  state.table = '';
  clearSidebarSearch();

  const list = document.getElementById('table-list');
  list.innerHTML = spinner(t('loadingTables'));
  resetContent();

  try {
    const d = await apiFetch('/api/tables?path=' + enc(path));
    // Successful response — remember this path even if the lake has no tables yet.
    pushRecentPath(path);
    if (d.tables.length === 0) {
      list.innerHTML = '<div class="state-box"><div class="icon">📭</div><div>' + esc(t('noTablesFound')) + '</div></div>';
      return;
    }
    list.innerHTML = d.tables.map(tbl =>
      '<div class="tbl-item" data-name="' + attr(tbl.name) + '" onclick="selectTable(\'' + attr(tbl.name) + '\')">' +
      '<div class="tbl-name">' + esc(tbl.name) + '</div>' +
      '<div class="tbl-path" title="' + attr(tbl.path) + '">' + esc(tbl.path) + '</div>' +
      '</div>').join('') +
      '<div id="sidebar-no-match" class="state-box" style="display:none;padding:1rem;font-size:.82rem">No matching tables</div>';
  } catch (e) {
    list.innerHTML = '<div class="state-box"><div class="icon">⚠️</div><div>' + esc(e.message) + '</div></div>';
  }
}

// ── Select & load table ───────────────────────────────────────────────────────
async function selectTable(name) {
  document.querySelectorAll('.tbl-item').forEach(el =>
    el.classList.toggle('active', el.dataset.name === name));
  state.table = name;
  state.page = 0;
  state.sortState = null;  // clear sort when switching tables
  await loadData();
}

async function loadData() {
  const inner = document.getElementById('content-inner');
  inner.innerHTML = spinner(t('loadingData'));

  try {
    const url = '/api/table/data?path=' + enc(state.lakePath) + '&table=' + enc(state.table) + '&page=' + state.page + '&size=' + state.pageSize;
    const d = await apiFetch(url);
    state.totalPages = d.totalPages;
    state.totalRows  = d.totalRows;
    state.lastColumns = d.columns;
    state.lastRows    = d.rows;
    renderTable(d);
  } catch (e) {
    inner.innerHTML = '<div class="state-box"><div class="icon">⚠️</div><div>' + esc(e.message) + '</div></div>';
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderTable(d) {
  const { columns, rows, totalRows, page, pageSize, totalPages } = d;
  const start = page * pageSize + 1;
  const end   = Math.min(start + rows.length - 1, totalRows);

  // Header
  const headerHtml = `
    <div id="content-header">
      <span class="tbl-title">${esc(state.table)}</span>
      <span class="meta-badge">${totalRows.toLocaleString()} ${t('rows')}</span>
      <span class="meta-badge">·</span>
      <span class="meta-badge">${columns.length} ${t('columns')}</span>
      <button class="btn btn-sm btn-outline-secondary"
              onclick="toggleSchemaPanel()"
              title="View table schema">
        Schema
      </button>
      <button class="btn btn-sm btn-outline-secondary"
              onclick="exportCsv()"
              ${rows.length === 0 ? 'disabled' : ''}
              title="Download the current page as CSV">
        ${t('exportCsv')}
      </button>
      <button class="btn btn-sm btn-outline-secondary"
              onclick="exportJson()"
              ${rows.length === 0 ? 'disabled' : ''}
              title="Download the current page as JSON">
        Export JSON
      </button>
      <button class="btn btn-sm btn-outline-secondary" onclick="toggleSqlEditor()"
              title="Open inline SQL query editor">
        SQL Editor
      </button>
      <div class="ms-auto d-flex align-items-center gap-2">
        <label class="text-muted mb-0" style="font-size:.8rem">${t('perPage')}</label>
        <select class="form-select form-select-sm" style="width:75px" onchange="changeSize(+this.value)">
          ${[20,50,100,200].map(n => `<option${n===pageSize?' selected':''}>${n}</option>`).join('')}
        </select>
      </div>
    </div>`;

  // Apply client-side sort if active
  let displayRows = rows;
  if (state.sortState !== null) {
    const { colIdx, dir } = state.sortState;
    displayRows = [...rows].sort((a, b) => {
      const av = a[colIdx], bv = b[colIdx];
      // nulls last
      if (av === null && bv === null) return 0;
      if (av === null) return 1;
      if (bv === null) return -1;
      // numeric comparison if both parse as numbers
      const an = Number(av), bn = Number(bv);
      const cmp = (!isNaN(an) && !isNaN(bn)) ? an - bn : String(av).localeCompare(String(bv));
      return dir === 'asc' ? cmp : -cmp;
    });
  }

  // Table
  const thead = `<tr>
    <th class="row-num">#</th>
    ${columns.map((c, i) => {
      const isSorted = state.sortState !== null && state.sortState.colIdx === i;
      const sortCls  = isSorted ? ` sort-${state.sortState.dir}` : '';
      const icon     = isSorted ? (state.sortState.dir === 'asc' ? '▲' : '▼') : '⇕';
      return `<th class="sortable${sortCls}" onclick="sortBy(${i})">` +
        `${esc(c.name)}<span class="sort-icon">${icon}</span>` +
        `<span class="col-type">${esc(c.type)}</span></th>`;
    }).join('')}
  </tr>`;

  const tbody = displayRows.length === 0
    ? `<tr><td colspan="${columns.length+1}" class="text-center text-muted py-4">${t('noData')}</td></tr>`
    : displayRows.map((row, i) => `<tr>
        <td class="row-num">${(start + i).toLocaleString()}</td>
        ${row.map(v => `<td title="${attr(v)}">${v === null ? '<span class="null-val">NULL</span>' : esc(String(v))}</td>`).join('')}
      </tr>`).join('');

  // Pagination
  const pages  = buildPages(page, totalPages);
  const sizeOpts = PAGE_SIZE_OPTIONS
    .map(n => `<option value="${n}"${n===pageSize?' selected':''}>${n}</option>`)
    .join('');
  const pager  = `
    <div id="pager" class="d-flex justify-content-between align-items-center">
      <span class="text-muted" style="font-size:.8rem">
        ${t('showing')} ${start.toLocaleString()} – ${end.toLocaleString()} ${t('of')} ${totalRows.toLocaleString()} ${t('rows')}
      </span>
      <div class="d-flex align-items-center gap-2">
        <label class="text-muted mb-0" style="font-size:.8rem">${t('rowsPerPage')}</label>
        <select class="form-select form-select-sm" style="width:80px"
                aria-label="Rows per page"
                onchange="changeSize(+this.value)">
          ${sizeOpts}
        </select>
      </div>
      <nav aria-label="Pagination">
        <ul class="pagination pagination-sm mb-0">
          <li class="page-item ${page===0?'disabled':''}">
            <a class="page-link" href="#" onclick="goPage(0);return false" title="First page">«</a></li>
          <li class="page-item ${page===0?'disabled':''}">
            <a class="page-link" href="#" onclick="goPage(${page-1});return false">‹</a></li>
          ${pages.map(p => p === '…'
            ? `<li class="page-item disabled"><span class="page-link">…</span></li>`
            : `<li class="page-item ${p===page?'active':''}">
                <a class="page-link" href="#" onclick="goPage(${p});return false">${p+1}</a>
               </li>`).join('')}
          <li class="page-item ${page>=totalPages-1?'disabled':''}">
            <a class="page-link" href="#" onclick="goPage(${page+1});return false">›</a></li>
          <li class="page-item ${page>=totalPages-1?'disabled':''}">
            <a class="page-link" href="#" onclick="goPage(${totalPages-1});return false" title="Last page">»</a></li>
        </ul>
      </nav>
    </div>`;

  document.getElementById('content-inner').innerHTML =
    headerHtml +
    '<div id="table-scroll"><table class="table table-sm table-hover data-tbl">' +
    '<thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table></div>' +
    pager;
}

// ── Column sort ────────────────────────────────────────────────────────────────
function sortBy(colIdx) {
  if (state.sortState !== null && state.sortState.colIdx === colIdx) {
    // Toggle direction
    state.sortState.dir = state.sortState.dir === 'asc' ? 'desc' : 'asc';
  } else {
    state.sortState = { colIdx, dir: 'asc' };
  }
  // Re-render with current cached data (no API call needed)
  if (state.lastColumns && state.lastRows) {
    renderTable({
      columns:    state.lastColumns,
      rows:       state.lastRows,
      totalRows:  state.totalRows,
      page:       state.page,
      pageSize:   state.pageSize,
      totalPages: state.totalPages,
    });
  }
}

// ── Pagination helpers ─────────────────────────────────────────────────────────
function buildPages(cur, total) {
  if (total <= 9) return Array.from({length: total}, (_, i) => i);
  const set = new Set([0, cur-2, cur-1, cur, cur+1, cur+2, total-1]);
  const valid = [...set].filter(p => p >= 0 && p < total).sort((a,b)=>a-b);
  const result = [];
  valid.forEach((p, i) => {
    if (i > 0 && p - valid[i-1] > 1) result.push('…');
    result.push(p);
  });
  return result;
}

async function goPage(p) {
  if (p < 0 || p >= state.totalPages) return;
  state.page = p;
  await loadData();
  document.getElementById('table-scroll')?.scrollTo(0, 0);
}

async function changeSize(n) {
  // Clamp to backend max (1000) defensively, even though the UI options stay below it.
  const size = Math.min(Math.max(1, n | 0), PAGE_SIZE_MAX);
  state.pageSize = size;
  state.page = 0;
  savePageSize(size);
  await loadData();
}

// ── CSV export ─────────────────────────────────────────────────────────────────
// Exports the page currently in memory (state.lastColumns / state.lastRows).
// RFC 4180: quote fields containing comma, quote, CR, or LF; escape embedded quotes by doubling.
function csvQuote(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function exportCsv() {
  const cols = state.lastColumns;
  const rows = state.lastRows;
  if (!state.table || !cols || !rows || rows.length === 0) {
    showErr(t('errNothingExport'));
    return;
  }

  const lines = [cols.map(c => csvQuote(c.name)).join(',')];
  for (const row of rows) {
    lines.push(row.map(csvQuote).join(','));
  }
  // CRLF per RFC 4180 + trailing newline.
  const csv = lines.join('\r\n') + '\r\n';

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `${state.table}-page${state.page + 1}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Free the object URL on the next tick (giving the browser time to start the download).
  setTimeout(() => URL.revokeObjectURL(url), 0);
}

// ── JSON export ────────────────────────────────────────────────────────────────
// Exports the page currently in memory as an array of row objects.
function exportJson() {
  const cols = state.lastColumns;
  const rows = state.lastRows;
  if (!state.table || !cols || !rows || rows.length === 0) {
    showErr('Nothing to export — load a table first.');
    return;
  }

  const data = rows.map(row => {
    const obj = {};
    cols.forEach((c, i) => { obj[c.name] = row[i]; });
    return obj;
  });

  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  const ts   = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  a.download = `${state.table}-page${state.page + 1}-${ts}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 0);
}

// ── Schema inspector ───────────────────────────────────────────────────────────
function toggleSchemaPanel() {
  const panel = document.getElementById('schema-panel');
  if (panel.classList.contains('open')) {
    closeSchemaPanel();
  } else {
    openSchemaPanel();
  }
}

function openSchemaPanel() {
  const cols = state.lastColumns;
  if (!cols) return;
  const list = document.getElementById('schema-list');
  list.innerHTML = cols.map(c => `
    <div class="schema-row">
      <div class="schema-col-name">${esc(c.name)}</div>
      <div class="schema-col-type">${esc(c.type)}</div>
    </div>`).join('');
  document.getElementById('schema-panel').classList.add('open');
}

function closeSchemaPanel() {
  document.getElementById('schema-panel').classList.remove('open');
}

// ── Misc ───────────────────────────────────────────────────────────────────────
function resetContent() {
  document.getElementById('content-inner').innerHTML =
    '<div class="state-box"><div class="icon">📊</div><div>' + esc(t('selectTable')) + '</div></div>';
}

function spinner(msg) {
  return '<div class="state-box"><div class="spinner-border text-primary" style="width:1.8rem;height:1.8rem"></div>' +
    '<div class="text-muted">' + esc(msg) + '</div></div>';
}

function showErr(msg) {
  document.getElementById('toast-msg').textContent = msg;
  bootstrap.Toast.getOrCreateInstance(document.getElementById('err-toast')).show();
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function attr(s) {
  if (s == null) return '';
  return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function enc(s) { return encodeURIComponent(s); }


// ── Inline SQL editor ──────────────────────────────────────────────────────────
let sqlEditorVisible = false;

function toggleSqlEditor() {
  const panel = document.getElementById('sql-editor-panel');
  if (!panel) return;
  sqlEditorVisible = !sqlEditorVisible;
  panel.style.display = sqlEditorVisible ? 'block' : 'none';
  if (sqlEditorVisible) {
    const inp = document.getElementById('sql-input');
    if (inp && !inp.value.trim()) {
      inp.value = `SELECT * FROM tbl LIMIT 100`;
    }
    inp?.focus();
  }
}

async function runSql() {
  const sql = document.getElementById('sql-input')?.value?.trim();
  if (!sql) return;
  const container = document.getElementById('sql-results-container');
  const rowCount  = document.getElementById('sql-row-count');
  if (container) container.innerHTML = '<div class="text-muted p-2" style="font-size:.82rem">Running…</div>';
  if (rowCount)  rowCount.textContent = '';

  try {
    const resp = await fetch('/api/table/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: state.lakePath + '/' + state.table, sql })
    });
    const d = await resp.json();
    if (!resp.ok) throw new Error(d.error || `HTTP ${resp.status}`);
    if (rowCount) rowCount.textContent = `${d.rowCount.toLocaleString()} row${d.rowCount !== 1 ? 's' : ''} returned`;
    renderSqlResults(d.columns, d.rows);
  } catch (e) {
    if (container) container.innerHTML = `<div class="text-danger p-2" style="font-size:.82rem">${esc(e.message)}</div>`;
  }
}

function renderSqlResults(cols, rows) {
  const container = document.getElementById('sql-results-container');
  if (!container) return;
  if (!cols || cols.length === 0) {
    container.innerHTML = '<div class="text-muted p-2" style="font-size:.82rem">No columns returned.</div>';
    return;
  }
  const thead = `<tr>${cols.map(c => `<th title="${attr(c.type)}">${esc(c.name)}<br><span style="font-size:.65rem;font-weight:400;color:#9aa5b4">${esc(c.type)}</span></th>`).join('')}</tr>`;
  const tbody = rows.length === 0
    ? `<tr><td colspan="${cols.length}" class="text-center text-muted py-2">(no rows)</td></tr>`
    : rows.map(row => `<tr>${row.map(v => `<td title="${attr(v)}">${v === null ? '<span class="null-val">NULL</span>' : esc(String(v))}</td>`).join('')}</tr>`).join('');
  container.innerHTML = `<table class="sql-result-tbl table table-sm table-hover">
    <thead>${thead}</thead>
    <tbody>${tbody}</tbody>
  </table>`;
}

function clearSql() {
  const inp = document.getElementById('sql-input');
  if (inp) inp.value = '';
  const container = document.getElementById('sql-results-container');
  if (container) container.innerHTML = '';
  const rowCount = document.getElementById('sql-row-count');
  if (rowCount) rowCount.textContent = '';
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  // Ctrl+Enter: run SQL query
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    const activeEl = document.activeElement;
    if (activeEl && activeEl.id === 'sql-input') {
      e.preventDefault();
      runSql();
    }
    return;
  }
  // '/': focus sidebar search (only when no text input is active)
  if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const activeEl = document.activeElement;
    const isInput = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable);
    if (!isInput) {
      const searchEl = document.getElementById('sidebar-search');
      if (searchEl) {
        e.preventDefault();
        searchEl.focus();
        searchEl.select();
      }
    }
  }
});

// ── Directory browser ──────────────────────────────────────────────────────────
let browseCurrentPath = '';
let browseModal = null;

async function openBrowseModal() {
  browseModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('browse-modal'));
  browseModal.show();
  // Start from the current path input value, falling back to server CWD
  const existing = document.getElementById('lake-path').value.trim();
  if (existing) {
    await browseTo(existing);
  } else {
    try {
      const d = await apiFetch('/api/fs/cwd');
      await browseTo(d.path);
    } catch {
      await browseTo('/');
    }
  }
}

async function browseTo(path) {
  const listEl = document.getElementById('browse-list');
  const pathEl = document.getElementById('browse-current-path');
  listEl.innerHTML = '<div class="p-3 text-center text-muted"><div class="spinner-border spinner-border-sm text-primary me-2"></div>' + t('loadingTables') + '</div>';

  try {
    const d = await apiFetch('/api/fs/browse?path=' + enc(path));
    browseCurrentPath = d.path;
    pathEl.textContent = d.path;

    let html = '';

    if (d.parent !== null) {
      html += '<div class="browse-item browse-up" onclick="browseTo(\'' + attr(d.parent) + '\')">' +
        '<span class="browse-icon">📁</span>' +
        '<span class="browse-name fw-semibold">..</span>' +
        '<span class="text-muted ms-2" style="font-size:.78rem">' + t('parentDirectory') + '</span>' +
        '</div>';
    }

    if (d.dirs.length === 0) {
      html += '<div class="p-3 text-center text-muted" style="font-size:.85rem">' + t('noSubdirs') + '</div>';
    } else {
      html += d.dirs.map(entry =>
        '<div class="browse-item" onclick="browseTo(\'' + attr(entry.path) + '\')">' +
        '<span class="browse-icon">📁</span>' +
        '<span class="browse-name">' + esc(entry.name) + '</span>' +
        '</div>').join('');
    }

    listEl.innerHTML = html;
  } catch (e) {
    listEl.innerHTML = '<div class="p-3 text-danger">' + esc(e.message) + '</div>';
    pathEl.textContent = path;
  }
}

function confirmBrowse() {
  document.getElementById('lake-path').value = browseCurrentPath;
  browseModal?.hide();
}
</script>
</body>
</html>
