<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyLake — Delta Lake Browser</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --sidebar-w: 280px; }
    body { background: #f4f6f9; font-size: 0.9rem; }

    /* Layout */
    #app-layout { display: flex; height: calc(100vh - 110px); overflow: hidden; }
    #sidebar    { width: var(--sidebar-w); min-width: var(--sidebar-w); background: #fff;
                  border-right: 1px solid #dee2e6; display: flex; flex-direction: column; overflow: hidden; }
    #content    { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; }

    /* Navbar */
    .navbar { background: #1a1f36 !important; }
    .navbar-brand { font-weight: 700; letter-spacing: .03em; color: #fff !important; }
    .navbar-brand small { color: #8b9ec7; font-size: .75rem; }

    /* Path bar */
    #path-bar { background: #fff; border-bottom: 1px solid #dee2e6; padding: .6rem 1rem; }
    #path-bar .input-group { max-width: 720px; }

    /* Sidebar */
    .sidebar-header { padding: .55rem .75rem; font-size: .72rem; font-weight: 600;
                      color: #6c757d; text-transform: uppercase; letter-spacing: .06em;
                      background: #f8f9fa; border-bottom: 1px solid #eee; }
    #table-list     { overflow-y: auto; flex: 1; }
    .tbl-item       { padding: .5rem .75rem; cursor: pointer; border-bottom: 1px solid #f2f2f2;
                      transition: background .1s; }
    .tbl-item:hover { background: #f0f5ff; }
    .tbl-item.active { background: #e8f0fe; border-left: 3px solid #4285f4; }
    .tbl-name       { font-weight: 600; color: #212529; font-size: .87rem; }
    .tbl-path       { font-size: .73rem; color: #9aa5b4; white-space: nowrap;
                      overflow: hidden; text-overflow: ellipsis; }

    /* Content header */
    #content-header { padding: .5rem .85rem; border-bottom: 1px solid #eee;
                      background: #fafbfc; display: flex; align-items: center; gap: .75rem;
                      flex-shrink: 0; }
    .tbl-title      { font-weight: 700; font-size: .95rem; }
    .meta-badge     { font-size: .72rem; color: #6c757d; white-space: nowrap; }

    /* Data table */
    #table-scroll   { overflow: auto; flex: 1; }
    .data-tbl       { font-size: .82rem; margin: 0; }
    .data-tbl thead th { position: sticky; top: 0; background: #1a1f36; color: #fff;
                         white-space: nowrap; border: none; padding: .45rem .6rem; }
    .data-tbl thead th .col-type { font-size: .68rem; font-weight: 400; color: #8b9ec7;
                                    display: block; margin-top: 1px; }
    .data-tbl tbody td { white-space: nowrap; max-width: 280px; overflow: hidden;
                         text-overflow: ellipsis; padding: .32rem .6rem;
                         border-color: #f0f0f0; vertical-align: middle; }
    .data-tbl .row-num { color: #bbb; user-select: none; width: 46px; text-align: right; }
    .null-val         { color: #bbb; font-style: italic; font-size: .8rem; }

    /* Footer / pagination */
    #pager  { padding: .45rem .85rem; background: #fafbfc; border-top: 1px solid #eee;
              flex-shrink: 0; }
    .page-link { font-size: .82rem; padding: .22rem .55rem; }

    /* Empty / loading states */
    .state-box { display: flex; flex-direction: column; align-items: center; justify-content: center;
                 height: 100%; color: #9aa5b4; gap: .5rem; }
    .state-box .icon { font-size: 2.5rem; }

    /* Toast */
    .toast-container { z-index: 9999; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark px-3 py-2">
  <span class="navbar-brand mb-0">
    MyLake <small>Delta Lake Browser</small>
  </span>
  <span id="status-badge" class="badge bg-secondary px-2 py-1">Checking…</span>
</nav>

<!-- Path bar -->
<div id="path-bar">
  <div class="input-group">
    <span class="input-group-text bg-white">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="#6c757d" viewBox="0 0 16 16">
        <path d="M9.828 3h3.982a2 2 0 0 1 1.992 2.181l-.637 7A2 2 0 0 1 13.174 14H2.826a2 2 0 0 1-1.991-1.819l-.637-7a2 2 0 0 1 .342-1.31L.5 3a2 2 0 0 1 2-2h3.672a2 2 0 0 1 1.414.586l.828.828A2 2 0 0 0 9.828 3zm-8.322.12C1.72 3.042 1.95 3 2.19 3h5.396l-.707-.707A1 1 0 0 0 6.172 2H2.5a1 1 0 0 0-1 .981l.006.139z"/>
      </svg>
    </span>
    <input id="lake-path" type="text" class="form-control border-start-0"
           placeholder="Delta Lake root directory, e.g. /data/my_lake"
           autocomplete="off">
    <button class="btn btn-primary px-3" onclick="loadTables()">Load Tables</button>
  </div>
</div>

<!-- Main layout -->
<div id="app-layout">

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">Tables</div>
    <div id="table-list">
      <div class="state-box">
        <div class="icon">🗂</div>
        <div>Enter a path and click "Load Tables"</div>
      </div>
    </div>
  </div>

  <!-- Content area -->
  <div id="content">
    <div id="content-inner" style="display:flex;flex-direction:column;height:100%">
      <div class="state-box">
        <div class="icon">📊</div>
        <div>Select a table from the list</div>
      </div>
    </div>
  </div>

</div>

<!-- Error toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="err-toast" class="toast align-items-center text-bg-danger border-0" role="alert" data-bs-autohide="true" data-bs-delay="4000">
    <div class="d-flex">
      <div class="toast-body" id="toast-msg"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ── State ─────────────────────────────────────────────────────────────────────
let state = {
  lakePath: '',
  table: '',
  page: 0,
  pageSize: 50,
  totalPages: 0,
  totalRows: 0,
};

// ── Boot ──────────────────────────────────────────────────────────────────────
document.getElementById('lake-path').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadTables();
});
checkStatus();

// ── API helpers ───────────────────────────────────────────────────────────────
async function apiFetch(url) {
  const resp = await fetch(url);
  const json = await resp.json();
  if (!resp.ok) throw new Error(json.error || `HTTP ${resp.status}`);
  return json;
}

// ── Status ────────────────────────────────────────────────────────────────────
async function checkStatus() {
  const badge = document.getElementById('status-badge');
  try {
    const d = await apiFetch('/api/status');
    if (d.ready) {
      badge.textContent = 'Delta Ready';
      badge.className = 'badge bg-success px-2 py-1';
    } else {
      badge.textContent = 'Delta Not Ready';
      badge.className = 'badge bg-danger px-2 py-1';
      if (d.error) showErr('Failed to load delta extension: ' + d.error);
    }
  } catch {
    badge.textContent = 'Server Offline';
    badge.className = 'badge bg-danger px-2 py-1';
  }
}

// ── Load table list ───────────────────────────────────────────────────────────
async function loadTables() {
  const path = document.getElementById('lake-path').value.trim();
  if (!path) { showErr('Please enter a directory path'); return; }
  state.lakePath = path;
  state.table = '';

  const list = document.getElementById('table-list');
  list.innerHTML = spinner('Loading tables…');
  resetContent();

  try {
    const d = await apiFetch('/api/tables?path=' + enc(path));
    if (d.tables.length === 0) {
      list.innerHTML = `<div class="state-box"><div class="icon">📭</div><div>No Delta tables found</div></div>`;
      return;
    }
    list.innerHTML = d.tables.map(t => `
      <div class="tbl-item" data-name="${attr(t.name)}" onclick="selectTable('${attr(t.name)}')">
        <div class="tbl-name">${esc(t.name)}</div>
        <div class="tbl-path" title="${attr(t.path)}">${esc(t.path)}</div>
      </div>`).join('');
  } catch (e) {
    list.innerHTML = `<div class="state-box"><div class="icon">⚠️</div><div>${esc(e.message)}</div></div>`;
  }
}

// ── Select & load table ───────────────────────────────────────────────────────
async function selectTable(name) {
  document.querySelectorAll('.tbl-item').forEach(el =>
    el.classList.toggle('active', el.dataset.name === name));
  state.table = name;
  state.page = 0;
  await loadData();
}

async function loadData() {
  const inner = document.getElementById('content-inner');
  inner.innerHTML = spinner('Loading data…');

  try {
    const url = `/api/table/data?path=${enc(state.lakePath)}&table=${enc(state.table)}&page=${state.page}&size=${state.pageSize}`;
    const d = await apiFetch(url);
    state.totalPages = d.totalPages;
    state.totalRows  = d.totalRows;
    renderTable(d);
  } catch (e) {
    inner.innerHTML = `<div class="state-box"><div class="icon">⚠️</div><div>${esc(e.message)}</div></div>`;
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderTable(d) {
  const { columns, rows, totalRows, page, pageSize, totalPages } = d;
  const start = page * pageSize + 1;
  const end   = Math.min(start + rows.length - 1, totalRows);

  // Header
  const headerHtml = `
    <div id="content-header">
      <span class="tbl-title">${esc(state.table)}</span>
      <span class="meta-badge">${totalRows.toLocaleString()} rows</span>
      <span class="meta-badge">·</span>
      <span class="meta-badge">${columns.length} columns</span>
      <div class="ms-auto d-flex align-items-center gap-2">
        <label class="text-muted mb-0" style="font-size:.8rem">Per page</label>
        <select class="form-select form-select-sm" style="width:75px" onchange="changeSize(+this.value)">
          ${[20,50,100,200].map(n => `<option${n===pageSize?' selected':''}>${n}</option>`).join('')}
        </select>
      </div>
    </div>`;

  // Table
  const thead = `<tr>
    <th class="row-num">#</th>
    ${columns.map(c => `<th>${esc(c.name)}<span class="col-type">${esc(c.type)}</span></th>`).join('')}
  </tr>`;

  const tbody = rows.length === 0
    ? `<tr><td colspan="${columns.length+1}" class="text-center text-muted py-4">(no data)</td></tr>`
    : rows.map((row, i) => `<tr>
        <td class="row-num">${(start + i).toLocaleString()}</td>
        ${row.map(v => `<td title="${attr(v)}">${v === null ? '<span class="null-val">NULL</span>' : esc(String(v))}</td>`).join('')}
      </tr>`).join('');

  // Pagination
  const pages  = buildPages(page, totalPages);
  const pager  = `
    <div id="pager" class="d-flex justify-content-between align-items-center">
      <span class="text-muted" style="font-size:.8rem">
        Showing ${start.toLocaleString()} – ${end.toLocaleString()} of ${totalRows.toLocaleString()} rows
      </span>
      <nav aria-label="Pagination">
        <ul class="pagination pagination-sm mb-0">
          <li class="page-item ${page===0?'disabled':''}">
            <a class="page-link" href="#" onclick="goPage(0);return false" title="First page">«</a></li>
          <li class="page-item ${page===0?'disabled':''}">
            <a class="page-link" href="#" onclick="goPage(${page-1});return false">‹</a></li>
          ${pages.map(p => p === '…'
            ? `<li class="page-item disabled"><span class="page-link">…</span></li>`
            : `<li class="page-item ${p===page?'active':''}">
                <a class="page-link" href="#" onclick="goPage(${p});return false">${p+1}</a>
               </li>`).join('')}
          <li class="page-item ${page>=totalPages-1?'disabled':''}">
            <a class="page-link" href="#" onclick="goPage(${page+1});return false">›</a></li>
          <li class="page-item ${page>=totalPages-1?'disabled':''}">
            <a class="page-link" href="#" onclick="goPage(${totalPages-1});return false" title="Last page">»</a></li>
        </ul>
      </nav>
    </div>`;

  document.getElementById('content-inner').innerHTML = `
    ${headerHtml}
    <div id="table-scroll">
      <table class="table table-sm table-hover data-tbl">
        <thead>${thead}</thead>
        <tbody>${tbody}</tbody>
      </table>
    </div>
    ${pager}`;
}

// ── Pagination helpers ─────────────────────────────────────────────────────────
function buildPages(cur, total) {
  if (total <= 9) return Array.from({length: total}, (_, i) => i);
  const set = new Set([0, cur-2, cur-1, cur, cur+1, cur+2, total-1]);
  const valid = [...set].filter(p => p >= 0 && p < total).sort((a,b)=>a-b);
  const result = [];
  valid.forEach((p, i) => {
    if (i > 0 && p - valid[i-1] > 1) result.push('…');
    result.push(p);
  });
  return result;
}

async function goPage(p) {
  if (p < 0 || p >= state.totalPages) return;
  state.page = p;
  await loadData();
  document.getElementById('table-scroll')?.scrollTo(0, 0);
}

async function changeSize(n) {
  state.pageSize = n;
  state.page = 0;
  await loadData();
}

// ── Misc ───────────────────────────────────────────────────────────────────────
function resetContent() {
  document.getElementById('content-inner').innerHTML =
    `<div class="state-box"><div class="icon">📊</div><div>Select a table from the list</div></div>`;
}

function spinner(msg) {
  return `<div class="state-box">
    <div class="spinner-border text-primary" style="width:1.8rem;height:1.8rem"></div>
    <div class="text-muted">${esc(msg)}</div>
  </div>`;
}

function showErr(msg) {
  document.getElementById('toast-msg').textContent = msg;
  bootstrap.Toast.getOrCreateInstance(document.getElementById('err-toast')).show();
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function attr(s) {
  if (s == null) return '';
  return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function enc(s) { return encodeURIComponent(s); }
</script>
</body>
</html>
